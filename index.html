<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Laundry Tracker - Fixed Login Animation</title>
    
    <!-- Tailwind CSS Stylesheet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    
    <!-- Dependencies (html2pdf engine + Synchronous Firebase SDK Core) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body {
            background-color: #f0f9ff;
        }

        .login-card-container {
            position: relative;
            background-color: #ffffff;
            border: 1px solid rgba(14, 165, 233, 0.2);
            box-shadow: 0 10px 30px rgba(14, 165, 233, 0.1);
            display: flex;
            flex-direction: row;
            border-radius: 1rem;
            overflow: hidden;
        }
        
        .overlay-panel {
            position: absolute;
            top: 0;
            right: 0;
            width: 45%;
            height: 100%;
            background: linear-gradient(135deg, #0ea5e9 0%, #4f46e5 100%);
            transition: all 0.8s cubic-bezier(0.6, -0.28, 0.735, 0.045);
            z-index: 20;
            clip-path: polygon(15% 0%, 100% 0%, 100% 100%, 0% 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .form-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 55%;
            height: 100%;
            transition: all 0.8s ease-in-out;
            z-index: 10;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .ice-input {
            background-color: #f0f9ff !important;
            border: 1px solid #bae6fd !important;
            color: #0369a1 !important;
            transition: all 0.3s ease;
        }
        .ice-input:focus {
            border-color: #0ea5e9 !important;
            box-shadow: 0 0 10px rgba(14, 165, 233, 0.2) !important;
            background-color: #ffffff !important;
        }

        @media (max-width: 640px) {
            .login-card-container {
                display: flex;
                flex-direction: column;
            }
            .form-panel {
                position: relative;
                width: 100%;
                height: auto;
            }
            .overlay-panel {
                position: relative;
                width: 100%;
                height: 160px;
                clip-path: polygon(0% 20%, 100% 0%, 100% 100%, 0% 100%);
            }
        }

        @media (min-width: 641px) {
            .login-card-container {
                min-height: 520px;
            }
            .login-card-container.active-mode .overlay-panel {
                transform: translateX(-122%);
                width: 100%;
                clip-path: polygon(0% 0%, 100% 0%, 85% 100%, 0% 100%);
            }
        }
        
        .login-card-container.active-mode .form-panel {
            opacity: 0.3;
            filter: blur(4px);
        }

        /* PIN Input Base Styling */
        .pin-box-input {
            width: 3.25rem;
            height: 3.5rem;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 800;
            border-radius: 0.75rem;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        top 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        background 0.4s ease, border 0.4s ease, box-shadow 0.4s ease;
            z-index: 60;
        }

        /* Class applied while PIN boxes move/lift up from form into orbit position */
        .pin-box-input.lifting-pin {
            position: fixed !important;
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%) !important;
            border: 2px solid rgba(255, 255, 255, 0.9) !important;
            color: white !important;
            box-shadow: 0 15px 35px rgba(37, 99, 235, 0.6) !important;
            pointer-events: none;
        }

        /* Circular Orbit Container */
        .spinning-box-container {
            position: relative;
            width: 140px;
            height: 140px;
        }

        .spinning-box-container.active-orbit {
            animation: spinOrbit 1.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
        }

        /* Positions inside orbit box */
        .pin-box-input.in-orbit:nth-child(1) { top: 0; left: 0; }
        .pin-box-input.in-orbit:nth-child(2) { top: 0; right: 0; }
        .pin-box-input.in-orbit:nth-child(3) { bottom: 0; right: 0; }
        .pin-box-input.in-orbit:nth-child(4) { bottom: 0; left: 0; }

        @keyframes spinOrbit {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.12); }
            100% { transform: rotate(360deg) scale(1); }
        }

        @keyframes greenPop {
            0% { transform: scale(0.6); opacity: 0; }
            70% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .green-tick-animated {
            animation: greenPop 0.5s ease-out forwards;
        }
    </style>

    <script>
        let db;
        let currentUser = "";
        let globalLogs = [];

        const userPasswords = {
            "ESWAR": "2000",
            "KAVITHA": "1290",
            "SNEHITH": "2001"
        };

        // Define functions before attaching them
        window.handlePinInput = function(element, index) {
            element.value = element.value.replace(/[^0-9]/g, '');
            if (element.value.length === 1 && index < 3) {
                document.getElementById(`pin-box-${index + 1}`).focus();
            }
        };

        window.handlePinKeyDown = function(event, index) {
            if (event.key === 'Backspace' && !event.target.value && index > 0) {
                document.getElementById(`pin-box-${index - 1}`).focus();
            }
        };

        window.submitPassword = function(e) {
            if(e) e.preventDefault();
            
            const usernameInput = document.getElementById('modal-username-input').value.trim().toUpperCase();
            
            const pins = [
                document.getElementById('pin-box-0'),
                document.getElementById('pin-box-1'),
                document.getElementById('pin-box-2'),
                document.getElementById('pin-box-3')
            ];
            const passwordInput = pins.map(p => p.value).join('');

            const errorMsg = document.getElementById('login-error-msg');
            const cardContainer = document.getElementById('animated-card-box');

            if (userPasswords[usernameInput] && userPasswords[usernameInput] === passwordInput) {
                currentUser = usernameInput;
                errorMsg.classList.add('hidden');

                const overlay = document.getElementById('otp-animation-overlay');
                const spinningStage = document.getElementById('otp-spinning-stage');
                const successStage = document.getElementById('otp-success-stage');
                const spinContainer = document.getElementById('spinning-pin-container');

                // Reveal background overlay
                overlay.classList.remove('hidden');
                spinningStage.classList.remove('hidden');
                successStage.classList.add('hidden');
                spinContainer.classList.remove('active-orbit');

                // Get coordinates of the circular orbit container on screen
                const stageRect = spinContainer.getBoundingClientRect();
                const targetPositions = [
                    { top: stageRect.top, left: stageRect.left },
                    { top: stageRect.top, left: stageRect.left + stageRect.width - 50 },
                    { top: stageRect.top + stageRect.height - 50, left: stageRect.left + stageRect.width - 50 },
                    { top: stageRect.top + stageRect.height - 50, left: stageRect.left }
                ];

                // Fly animation: Lift PIN boxes from form inputs and glide to destination
                pins.forEach((pin, i) => {
                    const rect = pin.getBoundingClientRect();
                    
                    // Set starting pixel coordinates
                    pin.style.top = `${rect.top}px`;
                    pin.style.left = `${rect.left}px`;
                    pin.style.width = `${rect.width}px`;
                    pin.style.height = `${rect.height}px`;
                    pin.type = "text"; 
                    pin.classList.add('lifting-pin');

                    // Glide to target circle position
                    setTimeout(() => {
                        pin.style.top = `${targetPositions[i].top}px`;
                        pin.style.left = `${targetPositions[i].left}px`;
                        pin.style.width = `50px`;
                        pin.style.height = `50px`;
                    }, 40);
                });

                // Attach to spinning container and activate spin orbit
                setTimeout(() => {
                    spinContainer.classList.add('active-orbit');
                    pins.forEach(pin => {
                        pin.removeAttribute('style');
                        pin.classList.remove('lifting-pin');
                        pin.classList.add('in-orbit');
                        pin.style.position = 'absolute';
                        pin.style.width = '50px';
                        pin.style.height = '50px';
                        spinContainer.appendChild(pin);
                    });
                }, 650);

                // Stage 2: Green Tick Verification
                setTimeout(() => {
                    spinningStage.classList.add('hidden');
                    successStage.classList.remove('hidden');
                }, 2200);

                // Stage 3: Open Dashboard
                setTimeout(() => {
                    overlay.classList.add('hidden');
                    cardContainer.classList.add('active-mode');
                    
                    setTimeout(() => {
                        executeDashboardLogin();
                        cardContainer.classList.remove('active-mode'); 
                    }, 400);
                }, 3400);

            } else {
                errorMsg.classList.remove('hidden');
            }
        };

        function executeDashboardLogin() {
            document.getElementById('current-user').innerText = currentUser;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            listenToDatabase();
        }

        window.logout = function() {
            currentUser = "";
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('modal-username-input').value = "";
            
            const originalFormContainer = document.getElementById('pin-inputs-wrapper');
            for(let i=0; i<4; i++) {
                const pinBox = document.getElementById(`pin-box-${i}`);
                if(pinBox) {
                    pinBox.value = "";
                    pinBox.type = "password";
                    pinBox.removeAttribute('style');
                    pinBox.className = "ice-input pin-box-input focus:outline-none";
                    originalFormContainer.appendChild(pinBox);
                }
            }
        };

        function getItemTotal(log) {
            return (parseInt(log.pant) || 0) + (parseInt(log.shirt) || 0) + (parseInt(log.inners) || 0) + 
                   (parseInt(log.boxers) || 0) + (parseInt(log.towel) || 0) + (parseInt(log.bedsheet) || 0);
        }

        function listenToDatabase() {
            db.ref().on('value', function(snapshot) {
                const rawData = snapshot.val();
                globalLogs = [];
                
                if (rawData) {
                    const checkAndPush = (item, pathString) => {
                        if (item && typeof item === 'object' && item.date) {
                            if (!item.user || item.user.toUpperCase() === currentUser.toUpperCase()) {
                                globalLogs.push({ key: pathString, ...item });
                            }
                        }
                    };

                    Object.keys(rawData).forEach(key => {
                        if (key === 'laundry_records' && typeof rawData[key] === 'object') {
                            const subFolder = rawData[key];
                            Object.keys(subFolder).forEach(subKey => {
                                checkAndPush(subFolder[subKey], `laundry_records/${subKey}`);
                            });
                        } else {
                            checkAndPush(rawData[key], key);
                        }
                    });

                    globalLogs.sort((a, b) => new Date(b.date) - new Date(a.date));
                }
                renderTable(globalLogs);
            });
        }

        function saveLog(e) {
            e.preventDefault();
            const recordsRef = db.ref('laundry_records');
            recordsRef.push({
                user: currentUser,
                date: document.getElementById('log-date').value,
                pant: parseInt(document.getElementById('count-pant').value) || 0,
                shirt: parseInt(document.getElementById('count-shirt').value) || 0,
                inners: parseInt(document.getElementById('count-inners').value) || 0,
                boxers: parseInt(document.getElementById('count-boxers').value) || 0,
                towel: parseInt(document.getElementById('count-towels').value) || 0,
                bedsheet: parseInt(document.getElementById('count-bedsheet').value) || 0
            });

            ['count-pant', 'count-shirt', 'count-inners', 'count-boxers', 'count-towels', 'count-bedsheet'].forEach(id => {
                document.getElementById(id).value = 0;
            });
        }

        function renderTable(logs) {
            const tbody = document.getElementById('table-body');
            if(!tbody) return;
            tbody.innerHTML = "";

            if (logs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" class="text-center text-sky-600 py-8">No records found.</td></tr>`;
                return;
            }

            logs.forEach(log => {
                const total = getItemTotal(log);
                const tr = document.createElement('tr');
                tr.className = "hover:bg-sky-50 transition border-b border-sky-100 text-sky-900";
                tr.innerHTML = `
                    <td class="py-3 font-medium text-sky-950">${log.date}</td>
                    <td class="py-3"><span class="px-2 py-0.5 rounded text-xs font-semibold bg-sky-100 text-sky-700 border border-sky-200">${log.user || 'Legacy'}</span></td>
                    <td class="py-3 text-center font-medium">${log.pant}</td>
                    <td class="py-3 text-center font-medium">${log.shirt}</td>
                    <td class="py-3 text-center font-medium">${log.inners}</td>
                    <td class="py-3 text-center font-medium">${log.boxers}</td>
                    <td class="py-3 text-center font-medium">${log.towel}</td>
                    <td class="py-3 text-center font-medium">${log.bedsheet}</td>
                    <td class="py-3 text-center font-black text-sky-600"><span class="bg-sky-100 border border-sky-200 px-2 py-0.5 rounded-lg">${total}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.addEventListener("DOMContentLoaded", function() {
            const firebaseConfig = {
                apiKey: "AIzaSyBpSOTKv33YniPOVosU3FHSVoG6__SNTlg",
                authDomain: "laundry-management-32c18.firebaseapp.com",
                databaseURL: "https://laundry-management-32c18-default-rtdb.firebaseio.com",
                projectId: "laundry-management-32c18",
                storageBucket: "laundry-management-32c18.firebasestorage.app",
                messagingSenderId: "195267320338",
                appId: "1:195267320338:web:a89d3deba4d318ff8616cb",
                measurementId: "G-XZYPE7WQBN"
            };

            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.database();

            const dateInput = document.getElementById('log-date');
            if(dateInput) dateInput.valueAsDate = new Date();

            document.getElementById('laundry-form').addEventListener('submit', saveLog);
            document.getElementById('password-form').addEventListener('submit', window.submitPassword);
        });
    </script>
</head>
<body class="min-h-screen font-sans antialiased text-sky-900 flex flex-col justify-center py-6">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="w-full max-w-4xl mx-auto p-4">
        <div id="animated-card-box" class="login-card-container rounded-2xl">
            
            <div class="form-panel flex flex-col justify-center p-6 sm:p-12">
                <div class="mb-4">
                    <h2 class="text-3xl font-black text-sky-950 tracking-tight">Login</h2>
                    <p class="text-xs font-semibold text-sky-600 mt-1 uppercase tracking-wider">Access your profile</p>
                </div>
                
                <form id="password-form" class="space-y-4" autocomplete="off">
                    <div>
                        <label class="block text-xs font-bold text-sky-700 uppercase tracking-wide mb-1">Username</label>
                        <input type="text" id="modal-username-input" placeholder="Enter username (e.g. ESWAR)" required autocomplete="off" class="w-full rounded-xl px-4 py-3 text-sm focus:outline-none ice-input font-semibold uppercase">
                    </div>
                    
                    <div>
                        <label class="block text-xs font-bold text-sky-700 uppercase tracking-wide mb-2">PIN</label>
                        
                        <div id="pin-inputs-wrapper" class="flex items-center justify-between gap-2 max-w-xs">
                            <input type="password" id="pin-box-0" maxlength="1" required class="ice-input pin-box-input focus:outline-none" oninput="handlePinInput(this, 0)" onkeydown="handlePinKeyDown(event, 0)">
                            <input type="password" id="pin-box-1" maxlength="1" required class="ice-input pin-box-input focus:outline-none" oninput="handlePinInput(this, 1)" onkeydown="handlePinKeyDown(event, 1)">
                            <input type="password" id="pin-box-2" maxlength="1" required class="ice-input pin-box-input focus:outline-none" oninput="handlePinInput(this, 2)" onkeydown="handlePinKeyDown(event, 2)">
                            <input type="password" id="pin-box-3" maxlength="1" required class="ice-input pin-box-input focus:outline-none" oninput="handlePinInput(this, 3)" onkeydown="handlePinKeyDown(event, 3)">
                        </div>

                        <p id="login-error-msg" class="text-red-500 text-xs mt-2 hidden font-semibold">❌ Invalid Username or PIN.</p>
                    </div>
                    
                    <div class="pt-2 relative z-30">
                        <button type="submit" class="w-full bg-gradient-to-r from-blue-600 via-blue-700 to-indigo-600 hover:from-blue-700 hover:to-indigo-800 text-white font-bold py-3.5 rounded-xl transition-all duration-300 text-sm tracking-wider uppercase shadow-[0_4px_15px_rgba(37,99,235,0.3)] cursor-pointer focus:outline-none active:scale-[0.98]">
                            <span>Login</span>
                        </button>
                    </div>
                </form>
            </div>

            <div class="overlay-panel flex flex-col justify-center items-center text-center p-6 sm:p-8 text-white">
                <div class="w-12 h-12 sm:w-14 sm:h-14 bg-white bg-opacity-20 rounded-xl flex items-center justify-center text-xl sm:text-2xl mb-3 sm:mb-4 border border-white border-opacity-30 shadow-lg">
                    🧺
                </div>
                <h2 class="text-xl sm:text-2xl font-black tracking-tight mb-1 sm:mb-2 uppercase drop-shadow-md">Welcome Back!</h2>
                <div class="text-3xl mt-1 tracking-widest drop-shadow-md">👕👖🧦👗</div>
            </div>

        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="hidden max-w-6xl mx-auto w-full px-3 sm:px-4 py-4 sm:py-8">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-sky-100 mb-6 gap-4">
            <div>
                <h2 class="text-lg sm:text-xl font-bold text-sky-950">Hello, <span id="current-user" class="text-sky-600">User</span>!</h2>
            </div>
            <button onclick="window.logout()" class="bg-sky-50 hover:bg-sky-100 text-sky-700 font-semibold px-4 py-3 rounded-xl transition text-xs sm:text-sm border border-sky-200">
                Logout
            </button>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-sky-100">
            <h3 class="text-lg font-bold text-sky-950 mb-4">Laundry Logs</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="border-b border-sky-200 text-sky-700 bg-sky-50">
                            <th class="py-3 px-2 font-semibold text-xs">Date</th>
                            <th class="py-3 px-2 font-semibold text-xs">Owner</th>
                            <th class="py-3 px-2 font-semibold text-xs text-center">Pant</th>
                            <th class="py-3 px-2 font-semibold text-xs text-center">Shirt</th>
                            <th class="py-3 px-2 font-semibold text-xs text-center">Inners</th>
                            <th class="py-3 px-2 font-semibold text-xs text-center">Boxers</th>
                            <th class="py-3 px-2 font-semibold text-xs text-center">Towel</th>
                            <th class="py-3 px-2 font-semibold text-xs text-center">Bed Sheet</th>
                            <th class="py-3 px-2 font-semibold text-xs text-center text-sky-600">Total</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-sky-100 text-sky-900">
                        <tr><td colspan="9" class="text-center text-sky-600 py-8">Loading logs...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- PIN VERIFICATION ANIMATION OVERLAY -->
    <div id="otp-animation-overlay" class="fixed inset-0 bg-slate-950 bg-opacity-85 backdrop-blur-md z-50 flex items-center justify-center hidden">
        <div class="bg-slate-900 border border-sky-500/30 p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center text-white relative overflow-hidden">
            
            <!-- Orbiting Stage -->
            <div id="otp-spinning-stage" class="py-4">
                <h3 class="text-xl font-bold mb-1 tracking-tight">Verifying PIN</h3>
                <p class="text-xs text-sky-400 mb-6 uppercase tracking-wider">Please wait a moment...</p>
                
                <div class="relative w-44 h-44 mx-auto my-2 flex items-center justify-center">
                    <div id="spinning-pin-container" class="spinning-box-container"></div>
                </div>
            </div>

            <!-- Green Tick Stage -->
            <div id="otp-success-stage" class="py-4 hidden flex flex-col items-center">
                <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center mb-4 green-tick-animated" style="border: 3px solid #10b981; box-shadow: 0 0 25px rgba(16, 185, 129, 0.8);">
                    <svg style="width: 48px; height: 48px; color: #10b981;" fill="none" stroke="#10b981" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
                <h3 class="text-2xl font-black text-white tracking-tight mb-1">Verified Successfully</h3>
                <p class="text-xs font-bold uppercase tracking-wider" style="color: #10b981;">Verified & Secured 🔒</p>
            </div>
            
        </div>
    </div>

</body>
</html>
