<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

            🧺

            <span>Laundry</span>

        </div>

        <nav>

            <a class="active">🏠 Dashboard</a>

            <a>➕ New Entry</a>

            <a>📋 History</a>

            <a>📊 Reports</a>

            <a>⚙ Settings</a>

        </nav>

    </aside>

    <!-- Main -->

    <main class="main-content">

        <!-- Top Bar -->

        <header class="topbar">

            <div>

                <h1>Good Afternoon 👋</h1>

                <p>Welcome back, Eswar</p>

            </div>

            <button class="logout">

                Logout

            </button>

        </header>

        <!-- Statistics -->

        <section class="stats">

            <div class="stat-card">

                <h3>Today's Items</h3>

                <span>12</span>

            </div>

            <div class="stat-card">

                <h3>This Week</h3>

                <span>67</span>

            </div>

            <div class="stat-card">

                <h3>This Month</h3>

                <span>214</span>

            </div>

            <div class="stat-card">

                <h3>Weather</h3>

                <span>31°C ☀</span>

            </div>

        </section>

        <!-- Content -->

        <section class="content-grid">

            <div class="card large">

                <h2>Add Laundry</h2>

                <p>Form goes here...</p>

            </div>

            <div class="card">

                <h2>Weather</h2>

                <p>Weather widget...</p>

            </div>

            <div class="card full">

                <h2>Recent Laundry</h2>

                <p>History table...</p>

            </div>

        </section>

    </main>

</div>

</body>
</html>
